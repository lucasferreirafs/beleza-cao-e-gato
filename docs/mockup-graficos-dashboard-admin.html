<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esboço — Gráficos do Dashboard</title>
<style>
  :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#18221f;background:#f3f6f4;font-synthesis:none}
  *{box-sizing:border-box}
  body{margin:0;padding:32px;min-height:100vh}
  .charts{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr);gap:24px;align-items:start}
  .card{background:#fff;border:1px solid #e2e9e6;border-radius:16px;padding:24px;box-shadow:0 2px 5px #18221f08}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #e8eeeb;padding-bottom:16px}
  h2{font-size:17px;line-height:1.3;margin:0;font-weight:700;letter-spacing:-.02em}
  .pill{background:#e5eeeb;color:#1a4350;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap}
  .line-chart{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
  .axis{font-size:12px;fill:#697672}
  .grid{stroke:#e5ebe8;stroke-width:1}
  .trend{fill:none;stroke:#e54b18;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
  .point{fill:#fff;stroke:#e54b18;stroke-width:3}
  .donut-wrap{display:grid;justify-items:center;padding:18px 0 14px}
  .donut{width:196px;height:196px;border-radius:50%;position:relative;background:conic-gradient(#df4b17 0 35.09%,#194654 35.09% 64.91%,#ffac16 64.91% 84.80%,#8b9b97 84.80% 100%)}
  .donut:after{content:"";position:absolute;inset:26px;border-radius:50%;background:#fff}
  .donut-label{position:absolute;z-index:1;inset:0;display:grid;align-content:center;justify-items:center;pointer-events:none}
  .donut-label strong{font-size:24px;line-height:1.2}
  .donut-label span{font-size:11px;color:#697672;margin-top:3px}
  .legend{display:grid;gap:10px;margin:0;padding:0;list-style:none}
  .legend li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;font-size:13px;color:#586762}
  .dot{width:9px;height:9px;border-radius:50%}
  .legend strong{font-size:13px;color:#18221f}
  .legend em{font-style:normal;color:#84908c;font-size:12px;margin-left:4px}
  @media(max-width:760px){body{padding:18px 14px}.charts{grid-template-columns:1fr;gap:16px}.card{padding:19px}.card-head{align-items:flex-start}h2{font-size:15px}.donut{width:178px;height:178px}.donut:after{inset:24px}}
  @media(max-width:360px){.card{padding:16px}.legend li{font-size:12px;gap:7px}.legend em{font-size:11px}}
</style>
</head>
<body>
<main class="charts" aria-label="Esboço dos gráficos do dashboard administrativo">
  <section class="card" aria-labelledby="appointments-title">
    <header class="card-head"><h2 id="appointments-title">Agendamentos por Período (Últimos 6 meses)</h2><span class="pill">Mensal</span></header>
    <svg class="line-chart" viewBox="0 0 700 230" role="img" aria-labelledby="line-title line-desc">
      <title id="line-title">Agendamentos mensais</title><desc id="line-desc">Exemplo ilustrativo: fevereiro 32, março 58, abril 96, maio 88, junho 151 e julho 187 agendamentos.</desc>
      <line class="grid" x1="0" y1="35" x2="680" y2="35"/><line class="grid" x1="0" y1="95" x2="680" y2="95"/><line class="grid" x1="0" y1="155" x2="680" y2="155"/><line class="grid" x1="0" y1="215" x2="680" y2="215"/>
      <polyline class="trend" points="0,186 136,157 272,113 408,123 544,67 680,24"/>
      <circle class="point" cx="0" cy="186" r="4"/><circle class="point" cx="136" cy="157" r="4"/><circle class="point" cx="272" cy="113" r="4"/><circle class="point" cx="408" cy="123" r="4"/><circle class="point" cx="544" cy="67" r="4"/><circle class="point" cx="680" cy="24" r="4"/>
      <text class="axis" x="0" y="225" text-anchor="start">Fev</text><text class="axis" x="136" y="225" text-anchor="middle">Mar</text><text class="axis" x="272" y="225" text-anchor="middle">Abr</text><text class="axis" x="408" y="225" text-anchor="middle">Mai</text><text class="axis" x="544" y="225" text-anchor="middle">Jun</text><text class="axis" x="680" y="225" text-anchor="end">Jul</text>
    </svg>
  </section>
  <section class="card" aria-labelledby="services-title">
    <header class="card-head"><h2 id="services-title">Distribuição dos Serviços</h2></header>
    <div class="donut-wrap"><div class="donut" role="img" aria-label="342 serviços: Banho 120, Banho mais Tosa 102, Tosa 68 e Outros 52"><div class="donut-label"><strong>342</strong><span>Serviços</span></div></div></div>
    <ul class="legend" aria-label="Legenda da distribuição dos serviços">
      <li><span class="dot" style="background:#df4b17"></span><span>Banho <em>(35%)</em></span><strong>120</strong></li>
      <li><span class="dot" style="background:#194654"></span><span>Banho + Tosa <em>(30%)</em></span><strong>102</strong></li>
      <li><span class="dot" style="background:#ffac16"></span><span>Tosa <em>(20%)</em></span><strong>68</strong></li>
      <li><span class="dot" style="background:#8b9b97"></span><span>Outros <em>(15%)</em></span><strong>52</strong></li>
    </ul>
  </section>
</main>
</body>
</html>
