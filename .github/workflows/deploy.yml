name: Deploy via FTP

on:
  push:
    branches:
      - main  # Executa o deploy sempre que houver push na branch main

jobs:
  web-deploy:
    name: Deploy no InfinityFree
    runs-on: ubuntu-latest
    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Enviar arquivos via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /htdocs/ # Pasta raiz de destino no InfinityFree